<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- Light cream background matching the logo -->
  <rect width="32" height="32" fill="#f5f0e8" rx="4"/>
  <!-- Dark house pillars -->
  <rect x="8" y="12" width="3.5" height="12" fill="#1a1714"/>
  <rect x="20.5" y="12" width="3.5" height="12" fill="#1a1714"/>
  <!-- Dark roof/body -->
  <polygon points="8,12 16,5 24,12" fill="#1a1714"/>
  <rect x="8" y="12" width="16" height="6" fill="#1a1714"/>
  <!-- Gold arch on top -->
  <path d="M10 12 C10 6, 22 6, 22 12" fill="none" stroke="#C5A55A" stroke-width="1.2"/>
  <!-- Gold circle window -->
  <circle cx="16" cy="15" r="2" fill="#C5A55A"/>
  <!-- Gold base line -->
  <line x1="6" y1="24" x2="26" y2="24" stroke="#C5A55A" stroke-width="1"/>
</svg>
